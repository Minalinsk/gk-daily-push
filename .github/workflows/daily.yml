name: gk-daily-push

# 每天跑两次（北京时间），两条消息各推各的：
#   早上那次 —— 推「⏰ 考试日程提醒」+「📰 每日时政（昨晚要闻）」，要求 06:00~08:00 送到
#   晚上那次 —— 只推「📰 每日时政（当天要闻）」，要求 18:00~19:30 送到
# 日程提醒一天只发一条（早上那条）；脚本里还有 last_schedule 兜底，
# 手动触发或重跑都不会重复。
#
# ═══════════════════════════════════════════════════════════════════════
# ⚠️ 前提：GitHub 的 schedule 是「系统性晚点」，不是差几分钟
# ═══════════════════════════════════════════════════════════════════════
# 2026-10-03 把本仓库 30 次历史运行拆到 job 级核实，结论：
#
#   · cron UTC 18:07（北京 02:07）→ 实际派活晚 2.8 ~ 5.0 小时
#   · cron UTC 06:07（北京 14:07）→ 实际派活晚 5.2 ~ 7.6 小时
#
#   并且每次 run 的 created_at == run_started_at —— 说明晚点**全部发生在
#   GitHub 的 cron 调度层**（排队慢慢派），不是 runner 不够用。
#
#   所以「cron 设到点前一点点、到点直接跑」这条路走不通：cron 写 14:07
#   想 18:07 收到，实际它 19:16~21:44 才把这个 run 交给你。唯一可行的办法
#   是**把 cron 提前到「最坏晚点也还赶得上」的时刻**，然后在 job 里原地
#   等到目标时刻再动手。
#
#   而单个 job 最长只能跑 6 小时（GitHub 硬上限），所以提前量一旦超过
#   ~5.5 小时，就必须拆成多个 job 接力等待。
#
# ═══════════════════════════════════════════════════════════════════════
# 当前参数（要改先读上面这段）
# ═══════════════════════════════════════════════════════════════════════
#   早上：cron 北京 02:07 → 目标 06:07，提前量 4h，单个 job。
#         实测晚点 2.8~5.0h、窗口又宽（06:00~08:00），4h 基本够用，
#         保持不动（改动越小越不容易翻车）。
#   晚上：cron 北京 08:07 → 目标 18:07，提前量 10h，两个 job 接力
#         （08:07 起来 → 第一棒等到 13:07 交棒 → 第二棒等到 18:07 开跑）。
#         最坏晚点 7.6h 时仍有 2.4h 余量，能覆盖「晚点 ≤ 11.4 小时」；
#         两个 job 各自最多只等 5 小时，离 6 小时硬上限还留 1 小时。
#
#   开跑前再叠一个 0-20 分钟随机，让到达时刻不固定成一个「机器特征」。
#   随机**算在同一个睡眠预算里**（不是额外叠加）：预算富余多少就抖多少，
#   这样 job 时长有硬上界，不会顶到 timeout-minutes。
#
# ═══════════════════════════════════════════════════════════════════════
# 改 cron 时记得同步改这四处（只改 cron 会跑偏）
# ═══════════════════════════════════════════════════════════════════════
#   ① cron 本身
#   ② 两个 Wait 步骤里的 TARGET_UTC / TARGET_BJ
#   ③ PUSH_SCHEDULE 里比对的 cron 字符串（决定晚上那次要不要重发日程提醒）
#   ④ NEWS_DAY 里比对的 cron 字符串（决定这次看「昨天」还是「今天」的要闻）
on:
  schedule:
    - cron: '7 18 * * *'      # UTC 18:07 = 北京 02:07 触发 → 等到北京 06:07 开跑（单 job）
    - cron: '7 0 * * *'       # UTC 00:07 = 北京 08:07 触发 → 两棒接力等到北京 18:07 开跑
  workflow_dispatch:          # 支持手动触发，方便测试
    inputs:
      test_push:
        description: '只发一条测试消息，验证企业微信通道（不抓取、不动索引）'
        type: boolean
        default: false
      dry_run:
        description: '只抓取并打印，不真的推送'
        type: boolean
        default: false

permissions:
  contents: write             # 需要它才能把去重索引提交回仓库

concurrency:
  # 按「哪一次」分组：早/晚各自一组，互不干扰。
  #   共用一个组的话，晚上那个「正在睡 10 小时」的 run 会把第二天早上的 run
  #   堵在后面干等；手动触发没有 schedule 值，退回按 event_name 分。
  group: ${{ github.workflow }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

jobs:
  # ── 晚上那次的第一棒：只负责把时间耗掉，不干活，也不 checkout 仓库。
  #    它把「提前量 10 小时」里的前 5 小时吃掉，剩下的交给 push job 里的等待。
  #    只有晚上那次需要它；早上那次提前量只有 4 小时，单 job 够用。
  wait:
    if: github.event_name == 'schedule' && github.event.schedule == '7 0 * * *'
    runs-on: ubuntu-22.04
    # 这一棒最多等 5 小时（北京 08:07 → 13:07），6 小时硬上限内还留 1 小时。
    timeout-minutes: 350
    steps:
      # 等到北京 13:07（= UTC 05:07）就交棒。用绝对时刻而不是固定 sleep：
      #   派活早了 → 多等一会儿；派活晚了（已经过了这个点）→ 立刻交棒，
      #   剩下的等待交给 push job —— 两棒各自最多等 5 小时，合起来 10 小时提前量。
      # MAX_WAIT 是一道保险，防的是「排队跨过 UTC 零点」这种翻车：
      #   拖过 UTC 零点后 `date -u +%F` 已经翻到第二天，目标时刻会被算成
      #   20 多小时后 —— 那样会白等一整天，还会把 concurrency 队列堵死。
      #   所以超过 5.5 小时就不等了，立即交棒。
      #   ⚠️ 两个方向都要卡住：MAX_WAIT 要**大于**这一棒要等的时间（5 小时），
      #      又要**明显小于** 12 小时（跨零点算出来的 20 多小时不该被等）。
      - name: Wait until 13:07 (Beijing) — 第一棒
        run: |
          TARGET_UTC="05:07"     # 北京 13:07
          TARGET_BJ="13:07"
          MAX_WAIT=19800         # 5 小时 30 分，超过就不等了
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%F) $TARGET_UTC" +%s)
          diff=$((target - now))
          echo "本 job 开始于 UTC $(date -u '+%F %T')（北京 $(date -u -d '+8 hours' '+%F %T')）"
          if [ "$diff" -le 0 ]; then
            echo "已过北京 $TARGET_BJ（GitHub 派活晚了 $(( -diff / 60 )) 分钟），第一棒直接交棒"
          elif [ "$diff" -gt "$MAX_WAIT" ]; then
            echo "⚠️ 距北京 $TARGET_BJ 还有 $((diff / 60)) 分钟，超过 $((MAX_WAIT / 60)) 分钟上限（多半是排队跨了 UTC 零点），不等了，直接交棒"
          else
            echo "第一棒等到北京 $TARGET_BJ 再交棒，还需 $((diff / 60)) 分 $((diff % 60)) 秒"
            sleep "$diff"
          fi

  push:
    # 第一棒被跳过（早上那次、手动触发）时本 job 照样要跑，所以用 always()。
    needs: wait
    if: always()
    runs-on: ubuntu-22.04
    # ⚠️ 超时必须覆盖「这一棒等待（含随机抖动）+ 脚本耗时」。
    #    等待上限 MAX_WAIT=18000 秒（5 小时）**已经把随机算在预算里**，
    #    所以最长 = 5 小时 + 脚本。358 是 GitHub 单 job 6 小时硬上限(360) 以内
    #    能给到的最大值，留 2 分钟给 checkout 和收尾。
    timeout-minutes: 358

    steps:
      # ⚠️ 版本别往回调：v4 / v5 声明的是 Node 20 运行时，
      #    而 GitHub 已经弃用 Node 20（日志顶部会挂一条 ##[warning]
      #    "Node.js 20 is deprecated"，看着像报错，其实只是提醒）。
      #    checkout v5 / setup-python v6 起改用 Node 24。
      #    （没有直接上最新的 v7：v6 起 checkout 改了凭据持久化的实现，
      #      而本工作流依赖 persist-credentials 把 state/ 推回仓库，先稳一版。）
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 纯标准库实现，不需要 pip install，省时间也少一个失败点。
      #
      # GitHub 的 cron 只保证「大概这个时间把 job 拉起来」，不保证准点。
      # 所以这里用「绝对时刻」等到点再开跑，而不是固定 sleep 多少秒：
      #   派活早了（正常情况）就多等一会儿；派活晚了（已经过了目标时刻）
      #   就直接开跑，并把迟到的分钟数打进日志。
      # 目标时刻统一换算成 UTC（北京 = UTC+8），不依赖 runner 的时区数据。
      #
      # MAX_WAIT 是一道保险，防的是「排队跨过 UTC 零点」这种翻车：
      #   拖过 UTC 零点后 date -u +%F 已经翻到第二天，目标时刻会被算成
      #   "明天 22:07"，diff 一下变成 20 多小时 —— 那样会白等一整天。
      #   所以超过 5.5 小时就不等了，立即开跑。
      - name: Wait until 06:07 / 18:07 (Beijing)
        if: github.event_name == 'schedule'
        run: |
          if [ "${{ github.event.schedule }}" = "7 18 * * *" ]; then
            TARGET_UTC="22:07"     # 北京 06:07（早上那次）
            TARGET_BJ="06:07"
          else
            TARGET_UTC="10:07"     # 北京 18:07（晚上那次，第一棒已经等到 13:07）
            TARGET_BJ="18:07"
          fi
          # ⚠️ 这个上限同时是本 job 的**总睡眠预算**，随机延迟也算在里面（见下面 room）。
          #    15(18000 秒) 正好是「晚上第一棒 13:07 交棒 → 18:07 开跑」要等的时间。
          #    它必须满足：MAX_WAIT + 脚本最坏耗时 ≤ timeout-minutes。
          #    5 小时 + 脚本，压在 358 分钟以内。
          #    （以前随机延迟是**独立一步、叠加**在睡眠之上的，最坏
          #      5.5h + 20min = 5h50m，再算上脚本就会把 350 分钟的 timeout 顶爆。）
          MAX_WAIT=18000
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%F) $TARGET_UTC" +%s)
          base=$((target - now))

          # 0~20 分钟的随机抖动，用来打散到达时刻；但**只能在预算有富余时生效**，
          # 富余多少就用多少，绝不让总睡眠超过 MAX_WAIT —— 这是不超时的前提。
          # （晚上正常路径 base 正好 18000，富余为 0，抖动自动退化为 0。）
          jitter=$((RANDOM % 1201))
          if [ "$base" -le 0 ]; then
            # 已经到点、甚至已经迟到：别再叠随机了，少迟到一点是一点
            jitter=0
          fi
          room=$((MAX_WAIT - base))
          if [ "$room" -lt 0 ]; then room=0; fi
          if [ "$jitter" -gt "$room" ]; then jitter="$room"; fi
          diff=$((base + jitter))

          echo "本 job 开始于 UTC $(date -u '+%F %T')（北京 $(date -u -d '+8 hours' '+%F %T')）"
          if [ "$diff" -le 0 ]; then
            echo "已过北京 $TARGET_BJ，立即开跑（GitHub 派活晚了 $(( -diff / 60 )) 分钟）"
          elif [ "$diff" -gt "$MAX_WAIT" ]; then
            echo "⚠️ 距北京 $TARGET_BJ 还有 $((diff / 60)) 分钟，超过 $((MAX_WAIT / 60)) 分钟上限（多半是排队跨了 UTC 零点），不再等待，立即开跑"
          else
            echo "等到北京 $TARGET_BJ 再开跑（含 $((jitter / 60)) 分随机），还需 $((diff / 60)) 分 $((diff % 60)) 秒"
            sleep "$diff"
          fi

      - name: Run push script
        env:
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
          WEWORK_MSG_TYPE: ${{ vars.WEWORK_MSG_TYPE }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # 晚上那次（cron UTC 00:07）不重发日程提醒；手动触发按早上那套走。
          # 脚本里还有 last_schedule 兜底：同一天发过就跳过，不会再重复。
          # ⚠️ 这个字符串必须和上面的 cron 完全一致，改了 cron 就要一起改。
          PUSH_SCHEDULE: ${{ github.event.schedule == '7 0 * * *' && '0' || '1' }}
          # 「每日时政」看哪一天：早上看昨天、晚上看今天。
          # 直接按 cron 定死，不靠「现在几点」去猜 —— 万一排队晚了跨过中午 12 点，
          # 靠猜就会把早上那次也切成「今天」，跟晚上那次撞车。
          # 手动触发给 'auto'，还是按当前时间自动判断。
          NEWS_DAY: ${{ github.event.schedule == '7 0 * * *' && 'today' || (github.event_name == 'schedule' && 'yesterday' || 'auto') }}
        run: python main.py

      # 把索引和考试日历提交回仓库，记住推过什么、下次只推新的。
      # 只有内容真的变了才提交（state.py 里内容没变就不写盘），
      # 所以安静的日子不会平白多出提交。仓库保活另交给 keepalive.yml。
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore: 更新已推送索引 [skip ci]"
            git push || echo "提交失败（可能是分支保护），不影响任务本身"
          fi

name: gk-daily-push

# 每天跑一次，两条消息**各自固定在早上一个点钟到**：
#   「⏰ 考试日程提醒」—— 北京时间 **06:30**
#   「📰 每日时政」    —— 北京时间 **07:00**（脚本内再等半小时，和上面错开）
# 内容超长会自动拆成多条发（见 main.build_messages / exam_dates.build_reminders）。
#
# ═══════════════════════════════════════════════════════════════════════
# ⚠️ 为什么要"前一天傍晚就把任务拉起来"—— 改之前先读这段
# ═══════════════════════════════════════════════════════════════════════
# GitHub 的 schedule 是**系统性晚点**，不是差几分钟。本仓库实测：
#   · cron UTC 18:07（北京 02:07）实测晚 2.8 ~ 5.0 小时
#   · cron UTC 06:07（北京 14:07）实测晚 5.2 ~ 7.6 小时
# 而且每次 run 的 created_at == run_started_at —— 说明晚点**全部发生在
# GitHub 的 cron 调度层**（它自己拖几小时才创建 run），不是 runner 排队。
#
# 所以「cron 写到点前一点点、到点直接跑」这条路走不通：想要 06:30 送到、
# cron 就写 06:30 的话，实际可能下午才跑。唯一可行的办法是**把 cron 提前到
# "最坏晚点也还赶得上"的时刻**，然后在 job 里原地等到目标时刻再动手。
#
# 提前量必须大于最大晚点（实测 7.6 小时），这里取 **10 小时**。而单个 job
# 最多只能活 6 小时，所以这 10 小时要**拆成两棒接力**：
#
#   cron 北京 20:30（= UTC 12:30）
#     └─ wait 棒：原地等到 北京 02:00（等 5.5 小时）
#          └─ push 棒：等到 北京 06:30（等 4.5 小时）→ 推「考试日程提醒」
#                       脚本内再等到 北京 07:00            → 推「每日时政」
#
# 两棒分别等 5.5h / 4.5h，都在 6 小时硬上限以内。
# 覆盖范围：排队晚点 ≤ 10 小时都能准点 06:30 送达；10~11.5 小时会迟到但仍落在早上。
# 历史最坏 7.6 小时 → 还有 2.4 小时余量。
on:
  schedule:
    - cron: '30 12 * * *'     # UTC 12:30 = 北京 20:30（前一天）→ 次日 06:30 送达
  workflow_dispatch:          # 支持手动触发，方便测试
    inputs:
      test_push:
        description: '只发一条测试消息，验证企业微信通道（不抓取、不动索引）'
        type: boolean
        default: false
      dry_run:
        description: '只抓取并打印，不真的推送'
        type: boolean
        default: false

permissions:
  contents: write             # 需要它才能把去重索引提交回仓库

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ── 第一棒：只负责把提前量里的前 5.5 小时耗掉，不干活、也不 checkout 仓库。
  wait:
    # 只有定时触发才需要它；手动触发直接进 push。
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    # 这一棒最多等 5.5 小时（北京 20:30 → 次日 02:00），6 小时硬上限内还留 30 分钟。
    timeout-minutes: 350
    steps:
      # 等到北京 02:00（= UTC 18:00）就交棒，剩下的 4.5 小时交给 push 棒。
      # 用绝对时刻而不是固定 sleep：派活早了多等一会儿，派活晚了立刻交棒。
      # MAX_WAIT 是防"排队跨过 UTC 零点"的保险：跨零点后 `date -u +%F` 已经翻到
      # 第二天、目标时刻会被算成 20 多小时——那样会白等一整天，还会把并发队列堵死。
      # ⚠️ 它要**大于这一棒要等的时间（5.5h）**，又要**明显小于 12 小时**。
      - name: Wait until 02:00 (Beijing) — 第一棒
        run: |
          TARGET_UTC="18:00"       # 北京 02:00（次日）
          TARGET_BJ="02:00"
          MAX_WAIT=19800           # 5 小时 30 分
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%F) $TARGET_UTC" +%s)
          diff=$((target - now))
          echo "本 job 开始于 UTC $(date -u '+%F %T')（北京 $(date -u -d '+8 hours' '+%F %T')）"
          if [ "$diff" -le 0 ]; then
            echo "已过北京 $TARGET_BJ（GitHub 派活晚了 $(( -diff / 60 )) 分钟），第一棒直接交棒"
          elif [ "$diff" -gt "$MAX_WAIT" ]; then
            echo "⚠️ 距北京 $TARGET_BJ 还有 $((diff / 60)) 分钟，超过 $((MAX_WAIT / 60)) 分钟上限（多半是排队跨了 UTC 零点），不等了，直接交棒"
          else
            echo "第一棒等到北京 $TARGET_BJ 再交棒，还需 $((diff / 60)) 分 $((diff % 60)) 秒"
            sleep "$diff"
          fi

  push:
    # 第一棒被跳过（手动触发）时本 job 照样要跑，所以用 always()。
    needs: wait
    if: always()
    runs-on: ubuntu-22.04
    # 超时必须覆盖「本棒等待（≤4.5h）+ 脚本内的等待（0.5h）+ 脚本耗时」≈ 5.1 小时。
    # 给 330 分钟，离 GitHub 单 job 6 小时硬上限还留 30 分钟。
    timeout-minutes: 330

    steps:
      # ⚠️ 版本别往回调：v4 / v5 声明的是 Node 20 运行时，
      #    而 GitHub 已经弃用 Node 20（日志顶部会挂一条 ##[warning]
      #    "Node.js 20 is deprecated"，看着像报错，其实只是提醒）。
      #    checkout v5 / setup-python v6 起改用 Node 24。
      #    （没有直接上最新的 v7：v6 起 checkout 改了凭据持久化的实现，
      #      而本工作流依赖 persist-credentials 把 state/ 推回仓库，先稳一版。）
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 等到北京 06:30（= UTC 22:30）再开跑，把提前量剩下的 4.5 小时吃掉。
      # 派活晚了（已经过了这个点）就直接开跑，并把迟到多少分钟打进日志。
      - name: Wait until 06:30 (Beijing)
        if: github.event_name == 'schedule'
        run: |
          TARGET_UTC="22:30"       # 北京 06:30（= UTC 22:30，前一天）
          TARGET_BJ="06:30"
          MAX_WAIT=19800           # 5 小时 30 分（本棒最长只需 4.5 小时，留了余量）
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%F) $TARGET_UTC" +%s)
          diff=$((target - now))
          echo "本 job 开始于 UTC $(date -u '+%F %T')（北京 $(date -u -d '+8 hours' '+%F %T')）"
          if [ "$diff" -le 0 ]; then
            echo "已过北京 $TARGET_BJ，立即开跑（GitHub 派活晚了 $(( -diff / 60 )) 分钟）"
          elif [ "$diff" -gt "$MAX_WAIT" ]; then
            echo "⚠️ 距北京 $TARGET_BJ 还有 $((diff / 60)) 分钟，超过 $((MAX_WAIT / 60)) 分钟上限（多半是排队跨了 UTC 零点），不再等待，立即开跑"
          else
            echo "等到北京 $TARGET_BJ 再开跑，还需 $((diff / 60)) 分 $((diff % 60)) 秒"
            sleep "$diff"
          fi

      # 纯标准库实现，不需要 pip install，省时间也少一个失败点。
      - name: Run push script
        env:
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
          WEWORK_MSG_TYPE: ${{ vars.WEWORK_MSG_TYPE }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # 每天只有这一次运行，日程提醒照发。脚本里还有 last_schedule 兜底：
          # 同一天已经发过就跳过，手动重跑也不会重复。
          PUSH_SCHEDULE: '1'
          # 「每日时政」看哪一天：看**前一天**。
          # ⚠️ 别改成靠"现在几点"去猜 —— 排队晚点可能跨过中午 12 点，
          #    靠猜会把这天的内容切错。手动触发给 'auto'（按当前时间判断）。
          NEWS_DAY: ${{ github.event_name == 'schedule' && 'yesterday' || 'auto' }}
          # 时政这条要等到的北京时刻。⚠️ 必须和上面那个 Wait 步骤配套：
          #     Wait 等 06:30（推日程提醒），时政再晚半小时 → 07:00。
          # 两条消息错开发，不会同时炸出来。留空则抓完就一起发。
          NEWS_AT_BJ: '07:00'
        run: python main.py

      # 把索引和考试日历提交回仓库，记住推过什么、下次只推新的。
      # 只有内容真的变了才提交（state.py 里内容没变就不写盘），
      # 所以安静的日子不会平白多出提交。仓库保活另交给 keepalive.yml。
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore: 更新已推送索引 [skip ci]"
            git push || echo "提交失败（可能是分支保护），不影响任务本身"
          fi

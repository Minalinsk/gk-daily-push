name: gk-daily-push

# 每天跑两次（北京时间），两条消息各推各的：
#   06:07 —— UTC 前一天 22:07：推「⏰ 考试日程提醒」+「📰 每日时政（昨晚要闻）」
#   18:07 —— UTC 当天 10:07：只推「📰 每日时政（当天要闻）」
# 日程提醒一天只发一条（早上那条）；脚本里还有 last_schedule 兜底，
# 手动触发或重跑都不会重复。两次都会随机延迟 0~20 分钟，错开整点。
#
# ⚠️ cron 刻意不写整点（:00）：GitHub 的定时器在整点最挤，整点的任务会被推迟、
#    严重时直接漏跑（实测整点 cron 迟到过 1 小时 32 分）。挪到 :07 会稳很多。
#    改 cron 时记得同步改下面 PUSH_SCHEDULE 里比对的字符串。
on:
  schedule:
    - cron: '7 22 * * *'      # 北京时间 06:07（避开整点高峰）
    - cron: '7 10 * * *'      # 北京时间 18:07（避开整点高峰）
  workflow_dispatch:          # 支持手动触发，方便测试
    inputs:
      test_push:
        description: '只发一条测试消息，验证企业微信通道（不抓取、不动索引）'
        type: boolean
        default: false
      dry_run:
        description: '只抓取并打印，不真的推送'
        type: boolean
        default: false

permissions:
  contents: write             # 需要它才能把去重索引提交回仓库

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-22.04
    # ⚠️ 必须 > 随机延迟上限（20 分钟）+ 脚本耗时（实测约 2 分钟）。
    #    这里原来是 20，正好卡在边界上：延迟抽到 18 分钟以上时，
    #    job 会在推送脚本跑到一半被 GitHub 强杀（约 11% 的早上那次会中招）。
    #    留足余量后，最坏情况（延迟 20 分 + 脚本 3 分）也跑得完。
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 纯标准库实现，不需要 pip install，省时间也少一个失败点
      - name: Random Delay (0-20 min)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 1201))
          echo "本次随机延迟 ${DELAY} 秒（约 $((DELAY / 60)) 分 $((DELAY % 60)) 秒）"
          sleep $DELAY

      - name: Run push script
        env:
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
          WEWORK_MSG_TYPE: ${{ vars.WEWORK_MSG_TYPE }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # 18:07 那次（UTC 10:07）不重发日程提醒；手动触发按 06:07 那套走。
          # 脚本里还有 last_schedule 兜底：同一天发过就跳过，不会再重复。
          # ⚠️ 这个字符串必须和上面的 cron 完全一致，改了 cron 就要一起改。
          PUSH_SCHEDULE: ${{ github.event.schedule == '7 10 * * *' && '0' || '1' }}
        run: python main.py

      # 把索引和考试日历提交回仓库，记住推过什么、下次只推新的。
      # 只有内容真的变了才提交（state.py 里内容没变就不写盘），
      # 所以安静的日子不会平白多出提交。仓库保活另交给 keepalive.yml。
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore: 更新已推送索引 [skip ci]"
            git push || echo "提交失败（可能是分支保护），不影响任务本身"
          fi

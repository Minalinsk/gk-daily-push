name: gk-daily-push

# 每天跑两次（北京时间），两条消息各推各的：
#   07:00 —— UTC 前一天 23:00：推「⏰ 考试日程提醒」+「📰 每日时政（昨晚要闻）」
#   19:00 —— UTC 当天 11:00：只推「📰 每日时政（当天要闻）」
# 日程提醒一天只发一条（早上那条）；脚本里还有 last_schedule 兜底，
# 手动触发或重跑都不会重复。两次都会随机延迟 0~20 分钟，错开整点。
on:
  schedule:
    - cron: '0 23 * * *'      # 北京时间 07:00
    - cron: '0 11 * * *'      # 北京时间 19:00
  workflow_dispatch:          # 支持手动触发，方便测试
    inputs:
      test_push:
        description: '只发一条测试消息，验证企业微信通道（不抓取、不动索引）'
        type: boolean
        default: false
      dry_run:
        description: '只抓取并打印，不真的推送'
        type: boolean
        default: false

permissions:
  contents: write             # 需要它才能把去重索引提交回仓库

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 纯标准库实现，不需要 pip install，省时间也少一个失败点
      - name: Random Delay (0-20 min)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 1201))
          echo "本次随机延迟 ${DELAY} 秒（约 $((DELAY / 60)) 分 $((DELAY % 60)) 秒）"
          sleep $DELAY

      - name: Run push script
        env:
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
          WEWORK_MSG_TYPE: ${{ vars.WEWORK_MSG_TYPE }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # 19:00 那次（UTC 11:00）不重发日程提醒；手动触发按 07:00 那套走。
          # 脚本里还有 last_schedule 兜底：同一天发过就跳过，不会再重复。
          PUSH_SCHEDULE: ${{ github.event.schedule == '0 11 * * *' && '0' || '1' }}
        run: python main.py

      # ---- 抗「60 天无提交 → 定时任务被静默禁用」 ----
      # GitHub 的规矩：仓库连续 60 天没有新提交，就会把定时任务全部禁用，
      # 而且不报错、不提示，只是从此不再触发。
      # 这里每轮都改一次心跳文件，保证仓库永远在收提交：
      #   · if: always() —— 任务成功、失败、甚至脚本崩了，都会写
      #   · run_number 每轮递增，永远和上一次不一样，git 必定有 diff
      # 心跳文件本身没有别的用处，就是"证明我来过"。
      - name: Heartbeat（每轮必写，保证有东西可提交）
        if: always()
        run: |
          mkdir -p state
          cat > state/heartbeat.json <<EOF
          {
            "last_run_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "last_run_bj": "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')",
            "run_number": ${{ github.run_number }},
            "event": "${{ github.event_name }}"
          }
          EOF
          cat state/heartbeat.json

      # 索引提交回仓库有三个作用：
      # 1) 记住推过哪些，下次只推新的
      # 2) 存下考试日历
      # 3) 让仓库保持活跃（配合上面的心跳），避免定时任务被自动禁用
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有需要提交的变化"
          else
            git commit -m "chore: 更新索引与心跳 [skip ci]"
            git push || echo "提交失败（可能是分支保护），不影响任务本身"
          fi

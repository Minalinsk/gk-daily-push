name: gk-daily-push

# 每天跑两次（北京时间），两条消息各推各的：
#   早上那次 —— 推「⏰ 考试日程提醒」+「📰 每日时政（昨晚要闻）」，要求 06:00~08:00 送到
#   晚上那次 —— 只推「📰 每日时政（当天要闻）」，要求 18:00~19:30 送到
# 日程提醒一天只发一条（早上那条）；脚本里还有 last_schedule 兜底，
# 手动触发或重跑都不会重复。
#
# ⚠️ 关键约定：cron 只负责"把 job 拉起来"，真正的开跑时刻由下面
#    「Wait until … (Beijing)」等到点，再叠一个「开跑前」的 0-20 分钟随机：
#      02:07 触发 -> 等到 06:07 -> 随机 0-20 分 -> 开跑 -> 跑完直接推送（06:09~06:29）
#      14:07 触发 -> 等到 18:07 -> 随机 0-20 分 -> 开跑 -> 跑完直接推送（18:09~18:29）
#    为什么绕这一圈：GitHub 的定时器不准。同账号实测被拖过 1 小时 24 分 ~ 2 小时 53 分，
#    本仓库 06:07 那次 cron 实际 09:00 才派活（晚 1 小时 53 分）。
#    所以"到点直接跑"这种写法没用 —— 只能提前把 job 拉起来，再在 job 里等到目标时刻动手。
#
#    提前量为什么是 4 小时（而不是 1 小时）：
#      · 提前量就是"能吃掉多少排队延迟"。1 小时的时候，实测最坏延迟（2h53m）
#        会把消息甩到 09:00 之后，早就出了窗口；4 小时 + 窗口尾巴就吃得下。
#      · 提前量必须 > 最大排队延迟。否则派活时已经过了目标时刻，只能"迟到开跑"，
#        推送时刻变成 = 派活时刻 + 随机，完全靠运气。
#      · 但也不能无限提前：job 时长 = 提前量 + 随机 + 脚本，GitHub 单个 job 硬上限 6 小时。
#        （排队不算 job 时长 —— timeout-minutes 是从 job 真正开始跑那一刻算起的。）
#
#    定这套参数的顺序（以后改窗口照这个走）：
#      ① 先定窗口 [A, B]：几点到几点之间必须收到消息
#      ② 开跑目标 T 取窗口开头 —— T 越晚，能容忍的迟到就越少。现在 06:07 / 18:07
#      ③ 提前量 L：用来吃排队延迟。现在 4 小时
#      ④ cron = T - L（记得换算成 UTC，且尽量别写整点，整点最挤）
#      ⑤ MAX_WAIT 必须 > L（否则每天都会"不等就开跑"），又要明显小于 12 小时。现在 4.5 小时
#      ⑥ timeout-minutes 必须 > L + 随机 + 脚本最坏耗时。现在 330 分钟
#    这套参数跑出来的覆盖范围：排队延迟 ≤ 5 小时 15 分（早上）/ ≤ 4 小时 45 分（晚上）
#    时，消息一定落在窗口内（实测最坏延迟只有 2 小时 53 分，留了将近一倍余量）。
#    仿真脚本见仓库外的「定时窗口仿真.py」（把排队延迟从 0 扫到 6 小时，逐档标出推送时刻在不在窗口里）。
#
#    开跑前那 0-20 分钟随机，是为了让每天的消息到达时刻不固定成一个"机器特征"。
#    脚本跑完立刻推送，不再额外叠加推送前的随机。
#
#    改 cron 时记得同步改四处：
#      ① cron 本身
#      ② 下面 Wait 步骤里的 TARGET_UTC / TARGET_BJ / 比对的 cron 字符串
#      ③ PUSH_SCHEDULE 里比对的 cron 字符串（决定晚上那次要不要重发日程提醒）
#      ④ NEWS_DAY 里比对的 cron 字符串（决定这次看"昨天"还是"今天"的要闻）
on:
  schedule:
    - cron: '7 18 * * *'      # UTC 18:07 = 北京 02:07 触发（等到北京 06:07 开跑）
    - cron: '7 6 * * *'       # UTC 06:07 = 北京 14:07 触发（等到北京 18:07 开跑）
  workflow_dispatch:          # 支持手动触发，方便测试
    inputs:
      test_push:
        description: '只发一条测试消息，验证企业微信通道（不抓取、不动索引）'
        type: boolean
        default: false
      dry_run:
        description: '只抓取并打印，不真的推送'
        type: boolean
        default: false

permissions:
  contents: write             # 需要它才能把去重索引提交回仓库

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-22.04
    # ⚠️ 超时必须覆盖"最长等待 + 随机延迟 + 脚本耗时"。
    #    正常：等 4 小时（02:07 -> 06:07）+ 随机 20 分 + 脚本 2~3 分 ≈ 4 小时 23 分；
    #    最坏：脚本把每个源都重试满（约 1 小时）时约 5 小时 20 分。
    #    这里配 330 分钟（5.5 小时）：够用，同时离 GitHub 的 6 小时硬上限还留 30 分钟。
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 纯标准库实现，不需要 pip install，省时间也少一个失败点。
      #
      # GitHub 的 cron 只保证"大概这个时间把 job 拉起来"，不保证准点。
      # 所以这里用「绝对时刻」等到点再开跑，而不是固定 sleep 多少秒：
      #   派活早了（正常情况）就多等一会儿 —— 02:07 起来等到 06:07；
      #   派活晚了（已经过了目标时刻）就直接开跑，并把迟到的分钟数打进日志。
      # 目标时刻统一换算成 UTC（北京 = UTC+8），不依赖 runner 的时区数据，
      # 所以只用 date -u，不用 TZ=Asia/Shanghai。
      #
      # MAX_WAIT 是一道保险，防的是"排队跨过 UTC 零点"这种翻车：
      #   拖过 UTC 零点后 date -u +%F 已经翻到第二天，目标时刻会被算成
      #   "明天的 22:07"，diff 一下变成 20 多小时 —— 那样会白等一整天，
      #   还会把 concurrency 队列堵死（cancel-in-progress 是 false）。
      #   所以超过 4.5 小时就不等了，立即开跑。
      #   ⚠️ 两个方向都要卡住：MAX_WAIT 必须 **大于** 提前量（4 小时），
      #      否则每天都会走"不等"这条分支、变成提前 4 小时就推送；
      #      又要 **明显小于** 12 小时，否则跨零点算出来的 20 多小时
      #      反而会被当成"值得等"。改 cron / 改提前量时，这个数要一起看。
      - name: Wait until 06:07 / 18:07 (Beijing)
        if: github.event_name == 'schedule'
        run: |
          if [ "${{ github.event.schedule }}" = "7 18 * * *" ]; then
            TARGET_UTC="22:07"     # 北京 06:07（早上那次）
            TARGET_BJ="06:07"
          else
            TARGET_UTC="10:07"     # 北京 18:07（晚上那次）
            TARGET_BJ="18:07"
          fi
          MAX_WAIT=16200           # 4 小时 30 分，超过就不等了
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%F) $TARGET_UTC" +%s)
          diff=$((target - now))
          if [ "$diff" -le 0 ]; then
            echo "已过北京 $TARGET_BJ，立即开跑（GitHub 排队晚了 $(( -diff / 60 )) 分钟）"
          elif [ "$diff" -gt "$MAX_WAIT" ]; then
            echo "⚠️ 距北京 $TARGET_BJ 还有 $((diff / 60)) 分钟，超过 $((MAX_WAIT / 60)) 分钟上限（多半是排队跨了 UTC 零点），不再等待，立即开跑"
          else
            echo "等到北京 $TARGET_BJ 再开跑，还需 $((diff / 60)) 分 $((diff % 60)) 秒"
            sleep "$diff"
          fi

      # 到点后再叠一个 0-20 分钟的随机延迟，让每天的消息到达时刻不固定成一个"机器特征"。
      # 脚本跑完直接推送，不再额外叠加推送前的随机。
      # 只对定时触发生效；手动触发（测试）不加，方便复现。
      - name: Random 0-20 min delay
        if: github.event_name == 'schedule'
        run: |
          j=$((RANDOM % 1201))
          echo "随机延迟 $((j / 60)) 分 $((j % 60)) 秒后再开跑"
          sleep "$j"

      - name: Run push script
        env:
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
          WEWORK_MSG_TYPE: ${{ vars.WEWORK_MSG_TYPE }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # 晚上那次（cron UTC 06:07）不重发日程提醒；手动触发按早上那套走。
          # 脚本里还有 last_schedule 兜底：同一天发过就跳过，不会再重复。
          # ⚠️ 这个字符串必须和上面的 cron 完全一致，改了 cron 就要一起改。
          PUSH_SCHEDULE: ${{ github.event.schedule == '7 6 * * *' && '0' || '1' }}
          # 「每日时政」看哪一天：早上看昨天、晚上看今天。
          # 直接按 cron 定死，不靠"现在几点"去猜 —— 万一排队晚了跨过中午 12 点，
          # 靠猜就会把早上那次也切成"今天"，跟晚上那次撞车。
          # 手动触发给 'auto'，还是按当前时间自动判断。
          NEWS_DAY: ${{ github.event.schedule == '7 6 * * *' && 'today' || (github.event_name == 'schedule' && 'yesterday' || 'auto') }}
        run: python main.py

      # 把索引和考试日历提交回仓库，记住推过什么、下次只推新的。
      # 只有内容真的变了才提交（state.py 里内容没变就不写盘），
      # 所以安静的日子不会平白多出提交。仓库保活另交给 keepalive.yml。
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore: 更新已推送索引 [skip ci]"
            git push || echo "提交失败（可能是分支保护），不影响任务本身"
          fi

name: gk-daily-push

# 每天跑两次（北京时间），两条消息各推各的：
#   早上那次 —— 推「⏰ 考试日程提醒」+「📰 每日时政（昨晚要闻）」，要求 06:00~08:00 送到
#   晚上那次 —— 只推「📰 每日时政（当天要闻）」，要求 18:00~19:30 送到
# 日程提醒一天只发一条（早上那条）；脚本里还有 last_schedule 兜底，
# 手动触发或重跑都不会重复。
#
# ⚠️ 关键约定：cron 只负责"把 job 拉起来"，真正的开跑时刻由下面
#    「Wait until … (Beijing)」等到点，再叠一个「开跑前」的 0-20 分钟随机：
#      早上：02:07 触发 -> 等到 06:07 -> 随机 0-20 分 -> 开跑 -> 推（06:09~06:29）
#      晚上：10:07 触发 -> 第一棒等到 14:07 -> 第二棒等到 18:07 -> 随机 -> 推（18:09~18:29）
#    为什么绕这一圈：GitHub 的定时器不准，本仓库实测被拖过 2 小时 47 分 ~ 7 小时 38 分。
#    所以"到点直接跑"没用 —— 只能提前把 job 拉起来，再在 job 里等到目标时刻动手。
#
#    ⚠️ 为什么晚上那次要两棒接力（2026-10-03 改）：
#      GitHub 单个 job 的硬上限是 6 小时，一个 job 最多只能"等"约 5 小时半。
#      而实测晚间那次的排队延迟是 5 小时 10 分 ~ 7 小时 38 分（12 次全超标），
#      提前量 4 小时根本吃不下 —— 于是每次都走"已经过了目标时刻，立即开跑"
#      那条分支，消息实际落在 19:32~21:50，**12 次没有一次落进 18:00~19:30**。
#      现在的做法是"接力"：第一棒 job 先把时间等到 14:07（等满 4 小时就交棒），
#      第二棒再接过去等到 18:07。两个 job 各等 4 小时，加起来提前量就是 8 小时，
#      比实测最坏延迟（7 小时 38 分）还多 20 多分钟余量。
#      上午那次实测延迟 2 小时 47 分 ~ 5 小时、窗口又宽（06:00~08:00），
#      4 小时提前量够用，所以保持单 job 不变（改动越小越不容易翻车）。
#
#    定这套参数的顺序（以后改窗口照这个走）：
#      ① 先定窗口 [A, B]：几点到几点之间必须收到消息
#      ② 开跑目标 T 取窗口开头 —— T 越晚，能容忍的迟到就越少
#      ③ 提前量 L：用来吃排队延迟（晚上那次 = 第一棒 4 小时 + 第二棒 4 小时）
#      ④ cron = T - L（记得换算成 UTC，且尽量别写整点，整点最挤）
#      ⑤ 每一步的 MAX_WAIT 必须 > 那一棒要等的时间，又要明显小于 12 小时
#         （它是防"排队跨过 UTC 零点"的保险，见下面 Wait 步骤的注释）
#      ⑥ timeout-minutes 必须 > 那一棒等待 + 随机 + 脚本最坏耗时
#    这套参数跑出来的覆盖范围：排队延迟 ≤ 5 小时 33 分（早上）/ ≤ 8 小时 53 分（晚上）
#    时，消息一定落在窗口内（其中 ≤ 4 小时 / ≤ 8 小时的那部分还会准点落在目标时刻）。
#
#    开跑前那 0-20 分钟随机，是为了让每天的消息到达时刻不固定成一个"机器特征"。
#    脚本跑完立刻推送，不再额外叠加推送前的随机。
#
#    改 cron 时记得同步改四处：
#      ① cron 本身
#      ② 下面两个 Wait 步骤里的 TARGET_UTC / TARGET_BJ / 比对的 cron 字符串
#      ③ PUSH_SCHEDULE 里比对的 cron 字符串（决定晚上那次要不要重发日程提醒）
#      ④ NEWS_DAY 里比对的 cron 字符串（决定这次看"昨天"还是"今天"的要闻）
on:
  schedule:
    - cron: '7 18 * * *'      # UTC 18:07 = 北京 02:07 触发（等到北京 06:07 开跑）
    - cron: '7 2 * * *'       # UTC 02:07 = 北京 10:07 触发（第一棒等到 14:07，第二棒等到 18:07）
  workflow_dispatch:          # 支持手动触发，方便测试
    inputs:
      test_push:
        description: '只发一条测试消息，验证企业微信通道（不抓取、不动索引）'
        type: boolean
        default: false
      dry_run:
        description: '只抓取并打印，不真的推送'
        type: boolean
        default: false

permissions:
  contents: write             # 需要它才能把去重索引提交回仓库

concurrency:
  # 定时跑共用一组（早/晚两次本来就不会重叠），手动触发单独一组：
  # 等待中的 run 会一直占着并发组，共用一个组的话，白天手动 Run 一次
  # 可能排在晚上那次长达 8 小时的"等到点"后面干等。
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # ── 第一棒：只负责把时间耗掉，不干活。只有晚上那次需要（提前量 8 小时的一半）。
  #    不 checkout 仓库 —— 它只要一个能睡觉的 runner。
  wait:
    if: github.event_name == 'schedule' && github.event.schedule == '7 2 * * *'
    runs-on: ubuntu-22.04
    # 等待上限 4 小时（+ 一点启动余量），离 6 小时硬上限还有很大富余。
    timeout-minutes: 300

    steps:
      # 等到北京 14:07（= UTC 06:07）就交棒。用绝对时刻而不是固定 sleep：
      # 派活早了就多等一会儿；派活晚了（已经过了这个点）立刻交棒，
      # 剩下的等待交给第二棒 —— 两棒各自最多等 4 小时，合起来就是 8 小时提前量。
      # MAX_WAIT 是防"排队跨过 UTC 零点"的保险：拖过 UTC 零点后 date -u +%F 会
      # 翻到第二天，目标时刻被算成"明天 06:07"、差出 20 多小时，那会白等一整天。
      - name: Wait until 14:07 (Beijing) — 第一棒
        run: |
          TARGET_UTC="06:07"     # 北京 14:07
          MAX_WAIT=16200         # 4 小时 30 分，超过就不等了
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%F) $TARGET_UTC" +%s)
          diff=$((target - now))
          if [ "$diff" -le 0 ]; then
            echo "已过北京 14:07，第一棒不等了（GitHub 排队晚了 $(( -diff / 60 )) 分钟），直接交棒"
          elif [ "$diff" -gt "$MAX_WAIT" ]; then
            echo "⚠️ 距北京 14:07 还有 $((diff / 60)) 分钟，超过 $((MAX_WAIT / 60)) 分钟上限（多半是排队跨了 UTC 零点），不等了"
          else
            echo "第一棒等到北京 14:07，还需 $((diff / 60)) 分 $((diff % 60)) 秒"
            sleep "$diff"
          fi

  push:
    # 第一棒被跳过（早上那次、手动触发）时本 job 照样要跑，所以用 always()。
    needs: wait
    if: always()
    runs-on: ubuntu-22.04
    # ⚠️ 超时必须覆盖"这一棒等待 + 随机延迟 + 脚本耗时"。
    #    正常：早上等 ≤4 小时、晚上等 ≤4 小时（第一棒已经吃掉一半）+ 随机 20 分 + 脚本 2~3 分；
    #    最坏：脚本把每个源都重试满（约 1 小时）时约 5 小时 20 分。
    #    这里配 330 分钟（5.5 小时）：够用，同时离 GitHub 的 6 小时硬上限还留 30 分钟。
    timeout-minutes: 330

    steps:
      # ⚠️ 版本别往回调：v4 / v5 声明的是 Node 20 运行时，
      #    而 GitHub 已经弃用 Node 20（日志顶部会挂一条 ##[warning]
      #    "Node.js 20 is deprecated"，看着像报错，其实只是提醒）。
      #    checkout v5 / setup-python v6 起改用 Node 24。
      #    （没有直接上最新的 v7：v6 起 checkout 改了凭据持久化的实现，
      #      而本工作流依赖 persist-credentials 把 state/ 推回仓库，先稳一版。）
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 纯标准库实现，不需要 pip install，省时间也少一个失败点。
      #
      # GitHub 的 cron 只保证"大概这个时间把 job 拉起来"，不保证准点。
      # 所以这里用「绝对时刻」等到点再开跑，而不是固定 sleep 多少秒：
      #   派活早了（正常情况）就多等一会儿 —— 早上 02:07 起来等到 06:07；
      #   派活晚了（已经过了目标时刻）就直接开跑，并把迟到的分钟数打进日志。
      # 目标时刻统一换算成 UTC（北京 = UTC+8），不依赖 runner 的时区数据，
      # 所以只用 date -u，不用 TZ=Asia/Shanghai。
      #
      # MAX_WAIT 是一道保险，防的是"排队跨过 UTC 零点"这种翻车：
      #   拖过 UTC 零点后 date -u +%F 已经翻到第二天，目标时刻会被算成
      #   "明天的 22:07"，diff 一下变成 20 多小时 —— 那样会白等一整天，
      #   还会把 concurrency 队列堵死（cancel-in-progress 是 false）。
      #   所以超过 4.5 小时就不等了，立即开跑。
      #   ⚠️ 两个方向都要卡住：MAX_WAIT 必须 **大于** 这一棒要等的时间
      #      （早上 4 小时、晚上 4 小时 —— 晚上那 8 小时提前量里前 4 小时由
      #      第一棒 wait job 吃掉），否则每天都走"不等"那条分支、变成提前推送；
      #      又要 **明显小于** 12 小时，否则跨零点算出来的 20 多小时
      #      反而会被当成"值得等"。改 cron / 改提前量时，这个数要一起看。
      - name: Wait until 06:07 / 18:07 (Beijing)
        if: github.event_name == 'schedule'
        run: |
          if [ "${{ github.event.schedule }}" = "7 18 * * *" ]; then
            TARGET_UTC="22:07"     # 北京 06:07（早上那次）
            TARGET_BJ="06:07"
          else
            TARGET_UTC="10:07"     # 北京 18:07（晚上那次，第一棒已经等到 14:07）
            TARGET_BJ="18:07"
          fi
          MAX_WAIT=16200           # 4 小时 30 分，超过就不等了
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%F) $TARGET_UTC" +%s)
          diff=$((target - now))
          if [ "$diff" -le 0 ]; then
            echo "已过北京 $TARGET_BJ，立即开跑（GitHub 排队晚了 $(( -diff / 60 )) 分钟）"
          elif [ "$diff" -gt "$MAX_WAIT" ]; then
            echo "⚠️ 距北京 $TARGET_BJ 还有 $((diff / 60)) 分钟，超过 $((MAX_WAIT / 60)) 分钟上限（多半是排队跨了 UTC 零点），不再等待，立即开跑"
          else
            echo "等到北京 $TARGET_BJ 再开跑，还需 $((diff / 60)) 分 $((diff % 60)) 秒"
            sleep "$diff"
          fi

      # 到点后再叠一个 0-20 分钟的随机延迟，让每天的消息到达时刻不固定成一个"机器特征"。
      # 脚本跑完直接推送，不再额外叠加推送前的随机。
      # 只对定时触发生效；手动触发（测试）不加，方便复现。
      - name: Random 0-20 min delay
        if: github.event_name == 'schedule'
        run: |
          j=$((RANDOM % 1201))
          echo "随机延迟 $((j / 60)) 分 $((j % 60)) 秒后再开跑"
          sleep "$j"

      - name: Run push script
        env:
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
          WEWORK_MSG_TYPE: ${{ vars.WEWORK_MSG_TYPE }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # 晚上那次（cron UTC 02:07）不重发日程提醒；手动触发按早上那套走。
          # 脚本里还有 last_schedule 兜底：同一天发过就跳过，不会再重复。
          # ⚠️ 这个字符串必须和上面的 cron 完全一致，改了 cron 就要一起改。
          PUSH_SCHEDULE: ${{ github.event.schedule == '7 2 * * *' && '0' || '1' }}
          # 「每日时政」看哪一天：早上看昨天、晚上看今天。
          # 直接按 cron 定死，不靠"现在几点"去猜 —— 万一排队晚了跨过中午 12 点，
          # 靠猜就会把早上那次也切成"今天"，跟晚上那次撞车。
          # 手动触发给 'auto'，还是按当前时间自动判断。
          NEWS_DAY: ${{ github.event.schedule == '7 2 * * *' && 'today' || (github.event_name == 'schedule' && 'yesterday' || 'auto') }}
        run: python main.py

      # 把索引和考试日历提交回仓库，记住推过什么、下次只推新的。
      # 只有内容真的变了才提交（state.py 里内容没变就不写盘），
      # 所以安静的日子不会平白多出提交。仓库保活另交给 keepalive.yml。
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore: 更新已推送索引 [skip ci]"
            git push || echo "提交失败（可能是分支保护），不影响任务本身"
          fi

name: gk-daily-push

# 每天跑两次（北京时间）：
#   07:00 —— UTC 前一天 23:00，推「考试日程提醒」+「昨天要闻」
#   19:00 —— UTC 当天 11:00，只推「今天的要闻」（日程提醒一天一条就够，不重复发）
# 两次都会随机延迟 0~20 分钟，错开整点
on:
  schedule:
    - cron: '0 23 * * *'      # 北京时间 07:00
    - cron: '0 11 * * *'      # 北京时间 19:00
  workflow_dispatch:          # 支持手动触发，方便测试
    inputs:
      test_push:
        description: '只发一条测试消息，验证企业微信通道（不抓取、不动索引）'
        type: boolean
        default: false
      dry_run:
        description: '只抓取并打印，不真的推送'
        type: boolean
        default: false

permissions:
  contents: write             # 需要它才能把去重索引提交回仓库

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 纯标准库实现，不需要 pip install，省时间也少一个失败点
      - name: Random Delay (0-20 min)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 1201))
          echo "本次随机延迟 ${DELAY} 秒（约 $((DELAY / 60)) 分 $((DELAY % 60)) 秒）"
          sleep $DELAY

      - name: Run push script
        env:
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
          WEWORK_MSG_TYPE: ${{ vars.WEWORK_MSG_TYPE }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # 19:00 那次（UTC 11:00）不重发日程提醒；手动触发按 07:00 那套走
          PUSH_SCHEDULE: ${{ github.event.schedule == '0 11 * * *' && '0' || '1' }}
        run: python main.py

      # 索引提交回仓库有两个作用：
      # 1) 记住推过哪些，下次只推新的
      # 2) 让仓库保持活跃，避免定时任务因 60 天无活动被 GitHub 自动禁用
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore: 更新已推送索引 [skip ci]"
            git push || echo "提交失败（可能是分支保护），不影响任务本身"
          fi
